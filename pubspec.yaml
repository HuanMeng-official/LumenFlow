name: lumen_flow
description: "Chat With Your AI"
publish_to: "none"
version: 3.0.0+300

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  intl: any
  flutter_markdown_plus: ^1.0.12
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_svg: ^2.3.0
  pdf: ^3.13.1
  archive: ^4.5.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  sqlite3: ^3.8.0
  window_manager: ^0.5.2
  auto_orientation_v2: 2.4.7
  material_ui: ^1.8.0
  cupertino_ui: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/prompt/
    - assets/prompt/characters/zh/
    - assets/prompt/characters/en/
    - assets/prompt/characters/ja/
    - assets/prompt/characters/ko/
    - assets/logo.png
    - assets/collection_code.png
    - assets/platform/
    - assets/image/
    - assets/gen/generator.html
    - pubspec.yaml
